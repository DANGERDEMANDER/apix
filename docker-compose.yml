services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apix
      POSTGRES_PASSWORD: apix
      POSTGRES_DB: apix
    ports:
      - "5432:5432"
    volumes:
      - apix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apix -d apix"]
      interval: 2s
      timeout: 2s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APIX_DB_URL: postgresql+asyncpg://apix:apix@db:5432/apix
      APIX_ENV: docker
      APIX_CONFIG_DIR: /app/config
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./backend:/app/backend
    command: >
      uvicorn apix.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  apix_pgdata: