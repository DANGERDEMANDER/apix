# Collection sources. All is_enabled=false by default; live mode additionally
# requires APIX_ENABLE_LIVE=true. Synthetic and replay modes ignore is_enabled.
#
# The list matches the carriers and OTAs named in SIH 2026 PS 26056 exactly:
# airlines — IndiGo, Air India, Air India Express, Akasa Air, SpiceJet;
# OTAs — MakeMyTrip, Yatra, EaseMyTrip, Cleartrip, Ixigo, Goibibo.
# Vistara is deliberately excluded: it merged into Air India in 2024-25 and
# is not a separately operating carrier for the collection period.

sources:
  # ---- Airlines ----
  - name: IndiGo
    kind: airline
    base_url: https://www.goindigo.in
    rate_limit_rpm: 10
    crawl_delay_s: 6.0
    is_enabled: false
  - name: AirIndia
    kind: airline
    base_url: https://www.airindia.com
    rate_limit_rpm: 10
    crawl_delay_s: 6.0
