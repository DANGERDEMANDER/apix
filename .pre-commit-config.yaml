repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^backend/
        args: [--strict, --config-file=pyproject.toml]
        additional_dependencies:
          - pydantic==2.9.2
          - pydantic-settings==2.6.0
          - types-PyYAML

